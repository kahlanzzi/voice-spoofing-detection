# Security headers (team decision A13, 2026-11-01), installed as /etc/nginx/vsd_security_headers.conf.
# Included in every location of deploy/nginx.conf: a location with its own add_header drops the ones above it.
# `always`: also on nginx's own 404/413/429/503 answers and on API errors.

# Never no-referrer: the browser would then send "Origin: null", which the API's Origin check refuses (§4.8).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# Same origin only (the build has no inline script; fonts are self-hosted under /assets/); no <base> rewrite, forms
# post only here, no framing, no plugins.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
