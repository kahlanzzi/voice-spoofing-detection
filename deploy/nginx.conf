# The web front (docs/api_design.md §2, §4.8, §6; docs/setup.md "Running with Docker Compose").
# Copied over the image's /etc/nginx/nginx.conf by deploy/web.Dockerfile. It includes no conf.d/, so the image's default
# "main" log format (client address, Referer, User-Agent, X-Forwarded-For) is never loaded.
# Checked by tests/deploy/test_nginx_conf.py: keep the two in step.

user nginx;
worker_processes auto;
pid /run/nginx.pid;

# crit only: nginx's error lines carry a "client:" address field (rate-limit rejections, upstream errors).
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # No client address, no request header, no query string (§1, §7).
    log_format vsd '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout vsd;

    # Sign-in rate limit (§4.8, §9): POST /api/session per client IP. An empty key is not counted, so
    # GET and DELETE are not limited. The address lives only in this shared memory zone.
    map $request_method $signin_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $signin_limit_key zone=signin:1m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # Relative Location headers: an absolute one would name port 80, not the published 8001.
        absolute_redirect off;

        # Above body_limit() (max_size_bytes + 64 KiB) so the API's own 413 answers first. Bodies are
        # buffered under /var/cache/nginx, a tmpfs in docker-compose.yml (in memory, never on disk).
        client_max_body_size 22m;

        # Above analysis_timeout_s so the API's own 504 answers first.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # The API never sees the client address (§1); it also runs with --no-proxy-headers.
        # Set here only: a location with its own proxy_set_header would drop these.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";

        # nginx's own answers only. proxy_intercept_errors stays off, so every API error, including its
        # 413, 503 and 504, reaches the client unchanged (§6).
        error_page 404 @not_found;
        error_page 413 @too_large;
        error_page 429 @too_many;
        error_page 502 504 =503 @unavailable;

        # Security headers (A13): every location includes them, because a location with its own add_header
        # drops the server's. tests/deploy/test_nginx_conf.py checks each location.

        location = /api/session {
            include /etc/nginx/vsd_security_headers.conf;
            limit_req zone=signin burst=5 nodelay;
            proxy_pass http://api:8000;
        }

        location /api/ {
            include /etc/nginx/vsd_security_headers.conf;
            proxy_pass http://api:8000;
        }

        # The web app (team decision A2, 2026-11-01). / opens the Analyze page.
        location = / {
            include /etc/nginx/vsd_security_headers.conf;
            return 302 /analyze;
        }

        # The app's routes only, each served the build's index.html; no-cache so a new deploy is picked up.
        # /index.html itself, /history/foo and any other path stay a 404.
        location ~ "^/(signin|analyze|history|history/req_[0-9a-f]{32}|overview|status)$" {
            include /etc/nginx/vsd_security_headers.conf;
            add_header Cache-Control "no-cache";
            root /usr/share/vsd-web;
            try_files /index.html =404;
        }

        # Vite's hashed files: a missing one is a 404, never index.html. No `always` on Cache-Control, so a 404
        # is never cached as immutable.
        location ^~ /assets/ {
            include /etc/nginx/vsd_security_headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            root /usr/share/vsd-web;
            try_files $uri =404;
        }

        # Everything else, including FastAPI's /docs, /redoc and /openapi.json, is not routed.
        location / {
            include /etc/nginx/vsd_security_headers.conf;
            return 404;
        }

        # Empty types: the JSON type wins even when the path has an extension (/assets/x.js, /index.html).
        location @not_found {
            include /etc/nginx/vsd_security_headers.conf;
            types { }
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"The requested resource was not found.","request_id":null}}\n';
        }

        location @too_large {
            include /etc/nginx/vsd_security_headers.conf;
            types { }
            default_type application/json;
            return 413 '{"error":{"code":"file_too_large","message":"The file is larger than the size limit.","request_id":null}}\n';
        }

        location @too_many {
            include /etc/nginx/vsd_security_headers.conf;
            types { }
            default_type application/json;
            return 429 '{"error":{"code":"too_many_requests","message":"Too many sign-in attempts from this address; try again later.","request_id":null}}\n';
        }

        location @unavailable {
            include /etc/nginx/vsd_security_headers.conf;
            types { }
            default_type application/json;
            return 503 '{"error":{"code":"analysis_unavailable","message":"The analysis service is unavailable.","request_id":null}}\n';
        }
    }
}
