# Local run of the API, its PostgreSQL store and the web app (docs/setup.md "Running with Docker Compose"). nginx
# (web) is the only way in, on http://localhost:8001; the api and db publish no port. Never expose the API
# without nginx (docs/api_design.md §4.8 rate limit).

# Uploads that fit in /tmp at once. Each one uses /tmp twice (Starlette's spooled part, then the API's temp
# copy), so the tmpfs must be at least 2 x (max_size_bytes + 64 KiB) x this. nginx buffers each body once
# (client_max_body_size at most). The deploy tests check both.
# Nothing enforces this count yet: see the "limit concurrent analyses" Open item (Entry 116).
x-vsd-concurrent-uploads: 4

# PostgreSQL 18.7 for db and db-test (D53 (4)); tag and digest pinned together. CI's service container uses the
# same image (tests/deploy/test_deploy_ci.py checks they match).
x-vsd-postgres-image: &postgres-image postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc

# Server flags that keep row values out of the PostgreSQL log (docs/setup.md "Database"): no statement text, no
# parameters, no DETAIL line (a "Failing row contains (...)" detail can quote a note or a password hash), no
# client address. tests/deploy/test_deploy_compose.py checks each one.
x-vsd-postgres-command: &postgres-command
  - postgres
  - -c
  - log_statement=none
  - -c
  - log_min_error_statement=panic
  - -c
  - log_error_verbosity=terse
  - -c
  - log_parameter_max_length=0
  - -c
  - log_parameter_max_length_on_error=0
  - -c
  - log_min_duration_statement=-1
  - -c
  - log_connections=off
  - -c
  - log_disconnections=off
  - -c
  - log_hostname=off
  - -c
  - "log_line_prefix=%m [%p] "

services:
  db:
    image: *postgres-image
    command: *postgres-command
    environment:
      # The superuser exists for the image's first start only; the api never receives its password.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VSD_DB_PASSWORD:?set VSD_DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: vsd
      # C collation: text order = byte order, which the stored UTC times rely on (api/schema/0001_initial.sql).
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8 --auth-host=scram-sha-256
      # Read by deploy/postgres-init/10-app-role.sh on the first start: the password of the API's role, vsd_app.
      VSD_DB_APP_PASSWORD: ${VSD_DB_APP_PASSWORD:?set VSD_DB_APP_PASSWORD in .env (see .env.example)}
    volumes:
      - vsd-pg:/var/lib/postgresql   # PostgreSQL 18 keeps PGDATA in a versioned folder below this
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    # Over TCP: during the first start the image's temporary server listens on the socket only, so on a new
    # volume this passes only once the init, which creates vsd_app, is done. pg_isready does not log in.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "vsd_app", "-d", "vsd"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    # The entrypoint fixes the data folder's owner, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Test database only (docs/setup.md "Tests and CI"): docker compose --profile test up -d db-test. Data in
  # memory, on 127.0.0.1 only, no password (trust): never holds real data.
  db-test:
    profiles: [test]
    image: *postgres-image
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      # Read from the gitignored .env by Compose; only these keys enter the container. Empty or unset: no start.
      VSD_SIGNIN_HMAC_KEY: ${VSD_SIGNIN_HMAC_KEY:?set VSD_SIGNIN_HMAC_KEY in .env (see .env.example)}
      # The API's own role (vsd_app), never the superuser's password.
      VSD_DB_APP_PASSWORD: ${VSD_DB_APP_PASSWORD:?set VSD_DB_APP_PASSWORD in .env (see .env.example)}
    expose:
      - "8000"
    volumes:
      # The old SQLite store, read-only, for the one-time import (python -m api.migrate_sqlite); removed after
      # the rollback window (SDD v2.0 §5.4).
      - vsd-var:/app/var:ro
    tmpfs:
      - /tmp:size=192m,mode=1777   # temp uploads (temp_dir: null); in memory, gone at restart (NFR-03)
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # nginx (pinned by tag and digest in the Dockerfile) with the built app and deploy/nginx.conf copied in;
    # after a config edit, run docker compose build web.
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8001:80"   # the port in allowed_origins (configs/api.yaml)
    tmpfs:
      - /var/cache/nginx:size=96m   # buffered request bodies (uploads); in memory, gone at restart (NFR-03)
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vsd-pg:    # PostgreSQL data: accounts, sessions, lockout counts, analyses and notes
  vsd-var:   # the old SQLite store, kept read-only for the import
