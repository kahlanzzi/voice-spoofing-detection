# uvicorn --log-config for the API container (deploy/api.Dockerfile); a logging dictConfig, not an api.yaml key.
# The api logger writes its INFO lines (sign-in failure without username, success with account ID; §4.8).
# No access log: uvicorn.access has no handler and the container also runs --no-access-log, so no request
# line, client IP or GET /api/health line is written (§1, §4.8, §7).
version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  stderr:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
loggers:
  api:
    level: INFO
    handlers: [stderr]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: [stderr]
    propagate: false
  uvicorn.access:
    level: CRITICAL
    handlers: []
    propagate: false
