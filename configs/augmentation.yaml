schema_version: 1
config_version: augmentation-v1
decisions: [D50, D56]
sample_rate_hz: 16000
seed: 2026

training:
  allowed_splits: [train]
  apply_probability: 0.8
  family_sampling: uniform
  families:
    - recorded_noise
    - reverberation
    - codec
    - gain
    - rawboost

recorded_noise:
  snr_db:
    distribution: uniform
    min: 5.0
    max: 30.0

reverberation:
  convolution: full_then_crop_to_input

codec:
  option_sampling: uniform
  options:
    - {id: mp3_24, kind: mp3, bitrate_kbps: 24}
    - {id: mp3_48, kind: mp3, bitrate_kbps: 48}
    - {id: mp3_96, kind: mp3, bitrate_kbps: 96}
    - {id: opus_8, kind: opus, bitrate_kbps: 8}
    - {id: opus_16, kind: opus, bitrate_kbps: 16}
    - {id: opus_24, kind: opus, bitrate_kbps: 24}
    - {id: narrowband_mulaw, kind: narrowband_mulaw, bitrate_kbps: null}

gain:
  distribution: uniform
  min_db: -12.0
  max_db: 6.0
  peak_ceiling_dbfs: -1.0

rawboost:
  algorithm: 1
  implementation: independent_from_paper
  sample_rate_hz: 16000
  notch_bands: 5
  fir_coefficients: {distribution: uniform_integer, min: 10, max: 100}
  nonlinearity_order: 5
  centre_frequency_hz: {distribution: uniform, min: 20.0, max: 8000.0}
  bandwidth_hz: {distribution: uniform, min: 100.0, max: 1000.0}
  linear_gain_db: 0.0
  higher_order_gain_offset_db: {distribution: uniform, min: -20.0, max: -5.0}
  reference:
    repository: https://github.com/TakHemlata/RawBoost-antispoofing
    commit: 4f161a8b4d0d9f4a8431509ddd86c645869ef6c4
    file: RawBoost.py
    license: MIT

held_out_from_training:
  additive_noise_families: [white_gaussian]
  mp3_bitrates_kbps: [32, 64, 128]
  plain_low_pass: true

corpora:
  split_seed: 2026
  training_fraction: 0.5
  noise:
    name: MUSAN
    open_slr_id: 17
    archive_sha256: "86d1061c7e15b5c9e906777685c519701df51bfde3001e1070dcc9ffac955ee1"
    license_sha256: "9ba9550ad48438d0836ddab3da480b3b69ffa0aac7b7878b5a0039e7ab429411"
  rir:
    name: RIRS_NOISES
    open_slr_id: 28
    archive_sha256: "3b50cfde915b3984738169b4beb341e9f6b8062ae4c2076146c5db71c2c05dc7"
    license_sha256: "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

ffmpeg:
  executable: ffmpeg
  expected_version: "6.1.1-3ubuntu5"
  expected_codec_libraries:
    libavcodec: "    60. 31.102 / 60. 31.102"
    libavdevice: "   60.  3.100 / 60.  3.100"
    libavfilter: "    9. 12.100 /  9. 12.100"
    libavformat: "   60. 16.100 / 60. 16.100"
    libavutil: "     58. 29.100 / 58. 29.100"
    libpostproc: "   57.  3.100 / 57.  3.100"
    libswresample: "  4. 12.100 /  4. 12.100"
    libswscale: "     7.  5.100 /  7.  5.100"
