# Stage 17 API settings (docs/api_design.md §9). Read by api/config.py.
# VSD_API_CONFIG points the API at another file (tests, deployments).
# Mock = prototype value until the open decision is taken; proposal = value proposed in §9.
formats: [wav, flac, mp3]                      # mock; open decision 2
max_size_bytes: 20971520                       # 20 MB; mock; open decision 2
max_duration_s: 60                             # mock; open decision 2
audio_deletion: Deleted when processing finishes   # depends on open decision 4
analysis_timeout_s: 30                         # proposal; not a latency target (open decision 5)
# Analysis process pool (D53 (2)): K worker processes per API process; a request that finds all K busy gets
# 503 analysis_unavailable with Retry-After. docker-compose.yml sizes the api and web tmpfs from K.
analysis_workers: 2                            # mock, not measured; K per API process, replaced by the P4 load-test decision on the staging host with the real bundle (D53 (3))
analysis_retry_after_s: 30                     # mock, not measured; Retry-After on a full pool, <= analysis_timeout_s, replaced by the P4 load-test decision on the staging host with the real bundle (D53 (3))
analysis_worker_start_timeout_s: 60            # mock; one worker's start-up hook; set from the measured bundle load time in P1
page_size_max: 50                              # proposal
note_max_chars: 2000                           # proposal
stats_time_zone: UTC                           # open decision 6
notice_text: >-
  Decision support only. This result estimates whether the recording is synthetic.
  It does not prove fraud and does not verify identity.
# Which analyzer the workers build: mock (default; dev, CI) or bundle (the frozen ModelBundle, D48 (1)). The only
# key configs/api.bundle.yaml changes. The bundle is mounted read-only at bundle_dir and refused at start unless its
# bundle_manifest.json has this SHA-256 (F4, D60).
analyzer: mock
bundle_dir: /app/bundle/bundle-v1
bundle_manifest_sha256: edf4a205e12fc948a68575ebaa929145481aaa535d34e3353ef9535f92840efc
mock_deferral_on_fit: 0.0993                   # MockAnalyzer only; replaced by the bundle's value
temp_dir: null                                 # deployment setting; null = the system temp folder
# PostgreSQL store (§7, D53 (4)); deployment settings. The password is never here: the API reads it
# from VSD_DB_APP_PASSWORD. db = the Compose service; run outside Compose with VSD_API_CONFIG (docs/setup.md).
database_host: db
database_port: 5432
database_name: vsd
database_user: vsd_app                         # non-superuser role (deploy/postgres-init/10-app-role.sh)
database_pool_max: 4                           # connections per API process
database_timeout_s: 5                          # wait for a connection; the status probe uses its own 1 s
# Sign-in (§4.8, D47); values confirmed by the team in review of PR #82.
session_idle_minutes: 30                       # a session unused for longer is ended
session_absolute_hours: 12                     # from sign-in; never extended
lockout_threshold: 5                           # consecutive failed sign-ins before a lock
lockout_minutes: 15                            # lock length, and how long a failure counts
password_min_chars: 15                         # NIST SP 800-63B-4 §3.1.1.2 (single factor)
password_max_chars: 128
allowed_origins: [http://localhost:8001, http://127.0.0.1:8001]   # deployment setting; dev value
