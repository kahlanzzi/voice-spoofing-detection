# Stage 17 API settings (docs/api_design.md §9). Read by api/config.py.
# VSD_API_CONFIG points the API at another file (tests, deployments).
# Mock = prototype value until the open decision is taken; proposal = value proposed in §9.
formats: [wav, flac, mp3]                      # mock; open decision 2
max_size_bytes: 20971520                       # 20 MB; mock; open decision 2
max_duration_s: 60                             # mock; open decision 2
audio_deletion: Deleted when processing finishes   # depends on open decision 4
analysis_timeout_s: 30                         # proposal; not a latency target (open decision 5)
page_size_max: 50                              # proposal
note_max_chars: 2000                           # proposal
stats_time_zone: UTC                           # open decision 6
notice_text: >-
  Decision support only. This result estimates whether the recording is synthetic.
  It does not prove fraud and does not verify identity.
mock_deferral_on_fit: 0.0993                   # MockAnalyzer only; replaced by the bundle's value
temp_dir: null                                 # deployment setting; null = the system temp folder
database_path: var/api.sqlite                  # deployment setting; SQLite file (§7); relative = to the repo root
# Sign-in (§4.8, D47); values confirmed by the team in review of PR #82.
session_idle_minutes: 30                       # a session unused for longer is ended
session_absolute_hours: 12                     # from sign-in; never extended
lockout_threshold: 5                           # consecutive failed sign-ins before a lock
lockout_minutes: 15                            # lock length, and how long a failure counts
password_min_chars: 15                         # NIST SP 800-63B-4 §3.1.1.2 (single factor)
password_max_chars: 128
allowed_origins: [http://localhost:8001, http://127.0.0.1:8001]   # deployment setting; dev value
