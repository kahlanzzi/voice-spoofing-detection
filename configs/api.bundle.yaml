# configs/api.yaml with analyzer: bundle, and nothing else changed (tests/api/test_api_config.py). Chosen with
# VSD_API_CONFIG. Edit configs/api.yaml first; the comments on each value are there.
formats: [wav, flac, mp3]
max_size_bytes: 20971520
max_duration_s: 60
audio_deletion: Deleted when processing finishes
analysis_timeout_s: 30
analysis_workers: 2
analysis_retry_after_s: 30
analysis_worker_start_timeout_s: 60
page_size_max: 50
note_max_chars: 2000
stats_time_zone: UTC
notice_text: >-
  Decision support only. This result estimates whether the recording is synthetic.
  It does not prove fraud and does not verify identity.
analyzer: bundle
bundle_dir: /app/bundle/bundle-v1
bundle_manifest_sha256: edf4a205e12fc948a68575ebaa929145481aaa535d34e3353ef9535f92840efc
mock_deferral_on_fit: 0.0993
temp_dir: null
database_host: db
database_port: 5432
database_name: vsd
database_user: vsd_app
database_pool_max: 4
database_timeout_s: 5
session_idle_minutes: 30
session_absolute_hours: 12
lockout_threshold: 5
lockout_minutes: 15
password_min_chars: 15
password_max_chars: 128
allowed_origins: [http://localhost:8001, http://127.0.0.1:8001]
