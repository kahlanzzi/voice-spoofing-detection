# Continuous Integration — runs on every push to main and on every pull request.
#
# Kept light (CS 488 template): install, run the tests, remind about docs.
# Python 3.13 is the official version (D15). CI never downloads datasets:
# tests use synthetic data only (AGENTS.md hard rule 1, D20).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # The API tests run on PostgreSQL (D53 (4)): a throwaway test server on the runner, the same image as
    # docker-compose.yml (tests/deploy/test_deploy_ci.py checks the pin). No password: trust, test data only.
    services:
      postgres:
        image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the docs check can diff commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install CNN deps (CPU torch, then safetensors and wandb)
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cnn.txt

      - name: Run tests
        env:
          REQUIRE_TORCH_TESTS: "1"   # torch tests fail instead of skipping if torch is missing
          REQUIRE_POSTGRES_TESTS: "1"   # database tests fail instead of skipping if PostgreSQL is unreachable
          VSD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
        run: pytest -q

      # --- Docs reminder (always runs, never fails the build) -----------------
      - name: Docs reminder
        run: bash scripts/check-docs.sh

  # Analyst web app (Stage 18, ADR 0008 §5). Node comes from web/.nvmrc (exact pin).
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (lockfile only)
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  # End-to-end tests on the real stack (Stage 18 PR 5a; docs/setup.md "End-to-end tests"): docker compose with nginx
  # on 8001, Chromium only (Firefox is a local run). The HMAC key and both database passwords are made for this run
  # and masked; they are no repo secrets and are never committed. e2e/run.ts seeds the e2e accounts, runs Playwright and scans the outputs for the
  # password and the session cookie; the JSON report is uploaded only on failure and only if that scan is clean.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (lockfile only)
        working-directory: web
        run: npm ci

      - name: Make a per-run sign-in key and database passwords
        run: |
          for name in VSD_SIGNIN_HMAC_KEY VSD_DB_PASSWORD VSD_DB_APP_PASSWORD; do
            k=$(openssl rand -hex 32)
            echo "::add-mask::$k"
            echo "$name=$k" >> "$GITHUB_ENV"
          done

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 240

      # Not cached: --with-deps installs OS packages, and restoring the browser takes about as long as downloading it.
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Chromium)
        id: e2e
        working-directory: web
        run: npm run test:e2e

      - name: Upload the JSON report (failure, clean scan only)
        if: failure() && steps.e2e.outputs.scan == 'clean'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: web/playwright-report/results.json
          retention-days: 7

      - name: Stack logs (no passwords, cookies or IPs, docs/api_design.md §4.8; no row values, docs/setup.md)
        if: failure()
        run: docker compose logs db api web

      - name: Stop the stack
        if: always()
        run: docker compose down -v
